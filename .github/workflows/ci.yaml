name: "CI pipeline"

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --audit false

      - name: Lint code
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Cache node_modules
        uses: actions/cache@v4

        with:
          path: |

            **/node_modules

          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}

          restore-keys: |

            ${{ runner.os }}-modules-

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --audit false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build

      - name: Up docker services
        run: docker-compose -f ./src/tests/integration/docker-compose.test.yaml up -d --build
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: payment_records

      - name: Wait for Database
        run: |
          until docker exec $(docker ps -q --filter name=postgres) pg_isready -U postgres; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: 'Run unit tests'
        run: npm run test:unit

      - name: 'Run integration tests'
        run: npm run test:integration

      - name: Stop containers
        if: always()
        run: docker-compose -f ./src/tests/integration/docker-compose.test.yaml down

